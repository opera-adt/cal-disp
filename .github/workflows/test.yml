name: Tests
on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install package
        shell: micromamba-shell {0}
        run: pip install -e ".[test]"

      - name: Dependency budget of the core install
        shell: micromamba-shell {0}
        # what `pip install cal-disp` (no extras) pulls in, from the installed metadata
        run: python scripts/check_env_budget.py --closure cal-disp
      - name: Run tests
        shell: micromamba-shell {0}
        # From the repository root: the configuration is [tool.pytest.ini_options]
        # in pyproject.toml (testpaths, markers, filterwarnings=error, random seed)
        run: pytest -v --maxfail=1
