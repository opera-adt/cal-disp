services:
  cal-disp:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        BASE: ubuntu:22.04
        MAMBA_USER_ID: ${UID:-1000}
        MAMBA_USER_GID: ${GID:-1000}
        # export CAL_DISP_VERSION=$(docker/pep440-version.sh) before
        # `docker compose build`, or the image reports the placeholder
        CAL_DISP_VERSION: ${CAL_DISP_VERSION:-0.0.0.dev0+unknown}
    image: opera-adt/cal-disp:latest
    volumes:
      - ./data:/home/work/data
      - ./results:/home/work/results
    user: "${UID:-1000}:${GID:-1000}"
    command: cal-disp --help

  # Interactive shell with data/results mounted
  cal-disp-dev:
    extends: cal-disp
    command: bash
