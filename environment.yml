name: my-cal-disp
channels:
  - conda-forge
dependencies:
  # <3.14: the conda-forge netcdf4 build for 3.14 is abi3 and warns about the numpy ABI
  - python>=3.11,<3.14
  # C-extension packages best installed via conda
  - gdal
  - libgdal-netcdf
  - geopandas
  - rasterio
  - rioxarray
  - shapely
  - h5py
  # netCDF4 from conda shares one HDF5 with gdal/h5py; the pip wheel bundles
  # its own HDF5, which can crash when several threads read files (Venti D23)
  - netcdf4

  # Visualization (conda-forge has better platform support)
  - matplotlib-base
  - cmap

  # Development tools
  - pytest
  - pre-commit

  # Install the package and remaining Python deps via pip
  - pip
  - pip:
    - -e .
