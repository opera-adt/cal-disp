name: my-cal-disp
channels:
  - conda-forge
dependencies:
  # C-extension packages best installed via conda
  - gdal
  - libgdal-netcdf
  - geopandas
  - rasterio
  - rioxarray
  - shapely
  - h5py

  # Visualization (conda-forge has better platform support)
  - matplotlib-base
  - cmap

  # Development tools
  - pytest
  - pre-commit

  # Install the package and remaining Python deps via pip
  - pip
  - pip:
    - dem-stitcher
    - -e .
