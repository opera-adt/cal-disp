# CAL-DISP Algorithm Parameters
# Configuration for the calibration algorithm
# Schema version: 0.5 (the v0.5 algorithm, plan T49; the same values as
# algorithm_parameters_v05.yaml). Gamma 0.3: algorithm_parameters_gamma.yaml.
# Per-frame settings come from the Venti frame table
# (runconfig static_ancillary_group.algorithm_parameters_overrides_json).

calibration_options:

  # UNR grid product.
  # 'constant': UNR's precomputed linear rates, scaled to the acquisition
  # interval.  'variable': difference of the daily positions nearest the
  # reference and secondary dates.  Must match the staged UNR data
  # (`cal-disp download unr --grid-type`, runconfig unr_grid_type).
  #   Type: string.
  #   Options: ['constant', 'variable'].
  grid_type: constant

  # GNSS reference frame used for station timeseries.
  #   Type: string.
  #   Options: ['IGS20', 'IGS14'].
  reference_frame: IGS20

  # Apply Venti's region-offset unwrap-error correction to the displacement
  # field before fitting the calibration surface.  Off by default: Venti
  # segments the valid-data mask into connected components (not regions
  # bounded by phase discontinuities) and shifts every component whose
  # median differs from the first one by more than half an unwrapping cycle
  # (lambda/2 = 27.7 mm for Sentinel-1), which quantises the long-wavelength
  # signal the calibration fits into lambda/2 steps.  Enable only with a
  # segmentation validated on products with known unwrapping errors.
  #   Type: boolean.
  unwrap_error_correction: false

  # Apply the tropospheric correction when the runconfig lists tropo files
  # (removed before the fit and added back to the calibration surface).
  # false ignores the tropo files.
  #   Type: boolean.
  # v0.5: the tropo mode is set per frame (tropo.mode in the frame table).
  apply_tropo_correction: false

  # Remove the product's /corrections/solid_earth_tide before the fit (UNR
  # GNSS already has it removed) and add it back to the calibration surface.
  # A product without the layer is calibrated without it (warning).
  #   Type: boolean.
  apply_solid_earth_tide_correction: true

  # Side length of the moving window used for polynomial plane fitting, in
  # metres (windowed_plane only; the v0.5 loclin surface uses
  # surface.cutoff_wavelength_meters).
  #   Type: float.
  #   Units: metres.
  window_size_meters: 600000.0

  # Input DISP pixel spacing in metres.  30 m for DISP-S1.
  #   Type: float.
  #   Units: metres.
  posting_meters: 30.0

  # Integer downsampling factor applied before surface fitting.
  # Set to 1 to disable.  The calibration surface is upsampled back to full
  # resolution after fitting.
  #   Type: integer.
  #   Default: 6.
  downsample_factor: 6

  # Pixel aggregation method used during downsampling.
  #   Type: string.
  #   Options: ['mean', 'median'].
  downsample_method: mean

  # Weight downsampling by temporal coherence.
  # When true, the temporal_coherence layer from the DISP product is used as
  # per-pixel weights during aggregation; an error is raised if it is missing.
  #   Type: boolean.
  downsample_weighted: false

  # Pixels by which event / deformation masks are dilated.  Masked regions
  # are filled from their neighbours before the fit.
  #   Type: integer.
  event_mask_buffer_pixels: 0

  # Only without an event mask: fill pixels whose InSAR - GNSS residual
  # exceeds this many robust (1.4826 * MAD) sigmas before the fit.
  #   Type: float | null (null disables).
  residual_outlier_mad_threshold:

  # Only without an event mask: fill coherent residual regions above this
  # many robust sigmas before the fit.
  #   Type: float | null (null disables).
  residual_region_mad_threshold:

  # Minimum size of such a residual region, in (downsampled) pixels.
  #   Type: integer.
  residual_region_min_pixels: 20

  # Trim the most extreme 15% / 85% InSAR - GNSS residual quantiles inside
  # each fit window.
  #   Type: boolean.
  mask_fit_residual_outliers: true

  # Weight the windowed fit by the inverse GNSS LOS variance.
  #   Type: boolean.
  weight_fit_by_gnss_uncertainty: false

  # Post-assembly low-pass filter applied to the stitched calibration surface
  # to suppress window-boundary artefacts.
  #   Type: string.
  #   Options: ['gaussian', 'gaussian_fft', 'hanning_fft', 'savitzky_golay'].
  #   Default: 'gaussian'.
  calibration_surface_smoothing_method: gaussian

  # Sigma (pixels) for gaussian and FFT smoothing methods.
  # null  → auto-selects window_size_pixels / 8 (recommended).
  # 0     → disables smoothing entirely.
  # Ignored when calibration_surface_smoothing_method = 'savitzky_golay'.
  #   Type: float | null.
  calibration_surface_smoothing_sigma: 0.0

  # Savitzky-Golay filter parameters.
  # Active when calibration_surface_smoothing_method = 'savitzky_golay'.
  savitzky_golay:
    # Filter window length in pixels (must be odd, >= 3).
    #   Type: integer.
    window_length: 51

    # Polynomial order for fitting (must be < window_length).
    #   Type: integer.
    polyorder: 3

  # ---- v0.5 (Venti algorithm_parameters schema v2) ----

  # Calibration surface: local-linear kernel with a 50 km half-response cutoff
  # and a robust two-pass tie (R-S1 to R-S4). 'windowed_plane' is gamma.
  # Per frame: regions (islands), fit_mask (packaged stable-pixel masks).
  surface:
    method: loclin
    cutoff_wavelength_meters: 50000.0
    fill_gaps: true
    two_pass: true

  # Fit weights: temporal coherence to the power 8, times robust weights (TS-B1).
  weights:
    coherence_power: 8.0
    robust: true

  # calibration_std (sigma_CAL): k_grid inflates the GNSS grid sigma (per frame
  # from TS-G1 in the frame table); extrapolate_sigma gives sigma wherever the
  # calibration has a value (owner 2026-10-14).
  uncertainty:
    k_grid: 3.9
    extrapolate_sigma: true

  # GNSS grid: nodes within 50 km outside the frame constrain the edges (R-G2);
  # nodes inside deforming areas are excluded and re-interpolated
  # (remove-restore, with the runconfig's defo_area_db_json / event_db_json).
  gnss:
    buffer_meters: 50000.0
    exclude_defo_nodes: true
    reinterpolate_excluded: true
