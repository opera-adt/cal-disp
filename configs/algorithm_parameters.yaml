# CAL-DISP Algorithm Parameters
# Configuration for the calibration algorithm
# Schema version: 0.3

calibration_options:

  # GNSS model type.
  # 'constant' interpolates a single velocity field scaled to the acquisition
  # interval.  'variable' fetches epoch-specific GNSS displacements for each
  # (ref_date, sec_date) pair (requires more UNR data).
  #   Type: string.
  #   Options: ['constant', 'variable'].
  grid_type: constant

  # GNSS reference frame used for station timeseries.
  #   Type: string.
  #   Options: ['IGS20', 'IGS14'].
  reference_frame: IGS20

  # Earliest observation year included in velocity estimation.
  # Only used when grid_type = 'constant'.
  #   Type: float.
  starting_year: 2014.0

  # Apply watershed-based unwrap-error correction to the displacement field
  # before fitting the calibration surface.
  #   Type: boolean.
  unwrap_error_correction: true

  # Side length of the moving window used for polynomial plane fitting, in
  # metres.  A 30 km window at 30 m posting gives a 1000-pixel window.
  #   Type: float.
  #   Units: metres.
  window_size_meters: 30000.0

  # Input DISP pixel spacing in metres.  30 m for DISP-S1.
  #   Type: float.
  #   Units: metres.
  posting_meters: 30.0

  # Integer downsampling factor applied before surface fitting.
  # Set to 1 to disable.  The calibration surface is upsampled back to full
  # resolution after fitting.
  #   Type: integer.
  #   Default: 6.
  downsample_factor: 6

  # Pixel aggregation method used during downsampling.
  #   Type: string.
  #   Options: ['mean', 'median'].
  downsample_method: mean

  # Weight downsampling by temporal coherence.
  # When true, the temporal_coherence layer from the DISP product is used as
  # per-pixel weights during aggregation.  Falls back to unweighted
  # downsampling if the layer is unavailable.
  #   Type: boolean.
  downsample_weighted: false

  # Post-assembly low-pass filter applied to the stitched calibration surface
  # to suppress window-boundary artefacts.
  #   Type: string.
  #   Options: ['gaussian', 'gaussian_fft', 'hanning_fft', 'savitzky_golay'].
  #   Default: 'gaussian'.
  calibration_surface_smoothing_method: gaussian

  # Sigma (pixels) for gaussian and FFT smoothing methods.
  # null  → auto-selects window_size_pixels / 8 (recommended).
  # 0     → disables smoothing entirely.
  # Ignored when calibration_surface_smoothing_method = 'savitzky_golay'.
  #   Type: float | null.
  calibration_surface_smoothing_sigma:

  # Savitzky-Golay filter parameters.
  # Active when calibration_surface_smoothing_method = 'savitzky_golay'.
  savitzky_golay:
    # Filter window length in pixels (must be odd, >= 3).
    #   Type: integer.
    window_length: 51

    # Polynomial order for fitting (must be < window_length).
    #   Type: integer.
    polyorder: 3

    # Derivative order (0 = smoothing only).
    #   Type: integer.
    deriv: 0

  # FFT filter parameters.
  # Active when calibration_surface_smoothing_method is 'gaussian_fft' or
  # 'hanning_fft'.
  fft_filter:
    # Gaussian filter standard deviation in wavelength units.
    #   Type: float.
    gaussian_sigma: 0.1

    # Butterworth filter order.
    #   Type: integer.
    butterworth_order: 4

    # Apply filter in spatial domain instead of frequency domain.
    #   Type: boolean.
    spatial_domain: false

    # Taper image edges to reduce ringing artefacts.
    #   Type: boolean.
    taper_edges: true

    # Taper width as a fraction of image dimensions [0, 0.5].
    #   Type: float.
    taper_width: 0.05
