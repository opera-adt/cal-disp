# cal-disp v0.5 algorithm parameters (Venti plan T49): the set validated in the T46 benchmark
# (10/10 frames PASS, disp2vlm_validation docs/vnv/v0.5-calval-report.md). Not the default until
# T49.1 flips it after VnV sign-off. Per-frame settings (plate, tropo mode, k_grid, island regions,
# fit masks) come from Venti's frame table through static_ancillary_group
# .algorithm_parameters_overrides_json; remove-restore needs defo_area_db_json and event_db_json.
calibration_options:
  grid_type: constant
  reference_frame: IGS20
  # unwrap correction stays off until a trade study confirms it (owner 2026-10-09, Venti T62)
  unwrap_error_correction: false
  # tropo is chosen per frame (tropo.mode in the frame table); the legacy switch stays off
  apply_tropo_correction: false
  apply_solid_earth_tide_correction: true
  window_size_meters: 600000.0
  posting_meters: 30.0
  downsample_factor: 6
  downsample_method: mean
  downsample_weighted: false
  event_mask_buffer_pixels: 0
  residual_outlier_mad_threshold:
  residual_region_mad_threshold:
  residual_region_min_pixels: 20
  mask_fit_residual_outliers: true
  weight_fit_by_gnss_uncertainty: false
  calibration_surface_smoothing_method: gaussian
  calibration_surface_smoothing_sigma: 0.0
  savitzky_golay:
    window_length: 51
    polyorder: 3
  # local-linear surface, 50 km half-response cutoff, robust two-pass tie (R-S1 to R-S4)
  surface:
    method: loclin
    cutoff_wavelength_meters: 50000.0
    fill_gaps: true
    two_pass: true
  # coherence^8 x robust weights (TS-B1)
  weights:
    coherence_power: 8.0
    robust: true
  # sigma_CAL is the surface term; k_grid per frame from TS-G1 (frame table), 3.9 otherwise
  uncertainty:
    k_grid: 3.9
    # sigma_CAL wherever the calibration has a value: nearest fitted value, inflated
    # with the distance where the fit had too little weight (owner 2026-10-14)
    extrapolate_sigma: true
  # grid nodes within 50 km outside the frame constrain the edges (R-G2); nodes inside
  # deforming areas are excluded and re-interpolated (remove-restore)
  gnss:
    buffer_meters: 50000.0
    exclude_defo_nodes: true
    reinterpolate_excluded: true
