# cal-disp gamma (0.3) algorithm parameters: decision 0001 (docs/decisions/0001-gamma-config.md),
# agreed with the DISP-CAL lead on 2026-10-06. The 0.3 golden was built with exactly these values
# (scripts/build_golden_output.sh); tests/test_release_configs.py keeps them in step. After T49 flips
# the defaults to v0.5, run with this file to reproduce gamma.
calibration_options:
  grid_type: constant
  reference_frame: IGS20
  unwrap_error_correction: false
  apply_tropo_correction: false
  apply_solid_earth_tide_correction: true
  window_size_meters: 600000.0
  posting_meters: 30.0
  downsample_factor: 6
  downsample_method: mean
  downsample_weighted: false
  event_mask_buffer_pixels: 0
  residual_outlier_mad_threshold:
  residual_region_mad_threshold:
  residual_region_min_pixels: 20
  mask_fit_residual_outliers: true
  weight_fit_by_gnss_uncertainty: false
  calibration_surface_smoothing_method: gaussian
  calibration_surface_smoothing_sigma: 0.0
  savitzky_golay:
    window_length: 51
    polyorder: 3
  # Since v0.5 the defaults are the v0.5 algorithm: gamma pins the schema-v2
  # groups to the values that reproduce it (the 0.3 golden relied on the old
  # defaults for these).
  surface:
    method: windowed_plane
    cutoff_wavelength_meters: 50000.0
    fill_gaps: false
    two_pass: false
    regions: none
    region_min_pixels: 50
    fit_mask: null
  weights:
    coherence_power: 0.0
    robust: false
    filled_pixel_weight: 0.02
  gnss:
    buffer_meters: 0.0
    exclude_defo_nodes: false
    reinterpolate_excluded: false
    reprocessing: false
    snapshot_id: null
  uncertainty:
    k_grid: 1.0
    inflate_inside_areas: true
    extrapolate_sigma: false
    sigma_nonsecular_meters: 0.0
    sigma_disp_placeholder_mm: 10.0
