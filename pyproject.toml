[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-disp"
description = "OPERA DISP Calibration workflows"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
# The version will be written into a version.py upon install, auto-generated
# see section: setuptools_scm
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#dynamic-metadata
# dependencies will be read from text files
dynamic = ["version", "optional-dependencies"]
dependencies = [
  "numpy",
  "scipy",
  "xarray",
  "pandas",
  "pydantic>=2.0",
  "rasterio",
  "rioxarray",
  "geopandas",
  "pyproj>=3.3",
  "shapely",
  "h5py",
  "h5netcdf",
  "netcdf4",  # imported directly (workflow._read_wavelength_m)
  "requests",
  "urllib3",  # imported directly (download retry)
  "tqdm",
  "ruamel.yaml",
  "click",
  "matplotlib",
  "cmap",  # browse image colormaps
  # the `disp` extra brings what opera_utils.disp imports (reference pixel)
  "opera-utils[disp]",
  # Pinned to the commit the golden dataset and the regression tests were
  # produced with (pip reports it as 0.0.post1.dev80+g2a7e61f0c)
  "venti @ git+https://github.com/opera-adt/Venti@2a7e61f0ce3c51658afd4bbd9bf8570c72f4ac4e",
]

[project.urls]
Homepage = "https://github.com/opera-adt/cal-disp"
"Bug Tracker" = "https://github.com/opera-adt/cal-disp/issues"

# Entry points for the command line interface
[project.scripts]
cal-disp = "cal_disp.cli:cli_app"
# Same CLI under the name used in the delivery instructions
opera_cal-disp = "cal_disp.cli:cli_app"

[tool.setuptools.dynamic]
# Optional dependencies loaded from files
[tool.setuptools.dynamic.optional-dependencies.docs]
file = ["requirements/docs.txt"]

[tool.setuptools.dynamic.optional-dependencies.test]
file = ["requirements/test.txt"]

[tool.setuptools.dynamic.optional-dependencies.download]
file = ["requirements/download.txt"]

[tool.setuptools_scm]
# https://github.com/pypa/setuptools_scm#configuration-parameters
write_to = "src/cal_disp/_version.py"
# https://github.com/pypa/setuptools_scm#version-number-construction
version_scheme = "no-guess-dev" # Will not guess the next version

[tool.black]
# Lowest supported Python (requires-python); without it Black targets every
# version up to its newest and warns that the running Python cannot check it.
target-version = ["py311"]
# Same style as the pre-commit hook, so plain `black` gives identical results
preview = true
enable-unstable-feature = ["string_processing"]

[tool.ruff]
src = ["src"]
unsafe-fixes = true
exclude = [
    "*.ipynb",
    "src/cal_disp/_version.py",  # Auto-generated
]

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle (errors)
  "W",   # pycodestyle (warnings)
  "EXE", # flake8-executable
  "F",   # Pyflakes
  "I",   # isort
  "ISC", # flake8-implicit-str-concat
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
]
ignore = [
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D203",   # 1 blank line required before class docstring
  "D213",   # Multi-line docstring summary should start at the second line
  "N803",   # Argument name should be lowercase
  "N806",   # Variable _ in function should be lowercase
  "PIE796", # Non-unique values are redundant and likely a mistake.
  "PLR",    # Pylint Refactor
  "PTH123", # `open()` should be replaced by `Path.open()`
  "PTH207", # "Replace `glob` with `Path.glob` or `Path.rglob`
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"tests/**" = ["D", "N", "PTH"]
# Long lines are mostly the embedded HTML/CSS/JS viewer template
"scripts/build_unr_frame_db.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# The only pytest configuration: `pytest` and `pytest tests` (CI) read this
# section from the repository root. Do not add a tests/pytest.ini: it would
# take precedence and silently drop the seed, the ignores and filterwarnings.
[tool.pytest.ini_options]
testpaths = ["tests"]
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"
addopts = "-ra --strict-markers --strict-config --randomly-seed=1234 --ignore=scripts --ignore=docs --ignore=data"
markers = [
  "slow: full-workflow subprocess tests (deselect with -m 'not slow')",
  "integration: integration tests requiring external data or services",
  "requires_earthdata: tests requiring Earthdata credentials",
  "requires_network: tests requiring network access",
]
filterwarnings = [
  "error",
  "ignore:The 'shapely.geos' module is deprecated:DeprecationWarning",
  # DeprecationWarning thrown in pkg_resources for older numba verions and llvmlite
  "ignore:.*pkg_resources.*",
  "ignore:h5py is running against HDF5.*:UserWarning",
  # Benign Cython ABI notice from conda-forge's abi3 netCDF4 build
  "ignore:numpy.ndarray size changed, may indicate binary incompatibility:RuntimeWarning",
  # rasterio.transform uses the deprecated Affine `*` operator (affine >= 3)
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
  "ignore:Exception ignored in.* <_io.FileIO.*:pytest.PytestUnraisableExceptionWarning"
]

# ---------------------------------------------------------------------------
# pixi (https://pixi.sh): reproducible conda + PyPI environments and tasks.
#   pixi install            # default env: runtime + download extra
#   pixi run test           # dev env: pytest
#   pixi run lint           # dev env: pre-commit on all files
#   pixi shell -e dev       # activate the dev env
# The conda layer mirrors environment.yml; cal-disp itself (and its PyPI-only
# dependencies such as venti and opera-utils) is installed editable via pip.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
# <3.14: the conda-forge netcdf4 build for 3.14 is abi3 and warns about the numpy ABI
python = ">=3.11,<3.14"
# C-extension packages best installed via conda (share one GDAL/HDF5 stack)
gdal = "*"
libgdal-netcdf = "*"
geopandas = "*"
rasterio = ">=1.5"
rioxarray = "*"
shapely = "*"
h5py = "*"
h5netcdf = "*"
netcdf4 = "*"
numpy = "*"
scipy = "*"
xarray = "*"
pandas = "*"
pydantic = ">=2.0"
pyproj = ">=3.3"
requests = "*"
urllib3 = "*"
tqdm = "*"
"ruamel.yaml" = "*"
click = "*"
matplotlib-base = "*"
cmap = "*"
pip = "*"

[tool.pixi.pypi-dependencies]
cal-disp = { path = ".", editable = true, extras = ["download"] }

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-randomly = "*"
pyyaml = "*"

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
ruff = "*"
black = "*"
mypy = "*"
# Executing the fix-inspection notebooks in docs/notebooks/
ipykernel = "*"
nbconvert = "*"
nbformat = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings-python = ">=1.10"
mkdocs-jupyter = ">=0.25"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["test", "dev"], solve-group = "default" }
# Own solve-group: the docs toolchain must not constrain the runtime stack
docs = { features = ["docs"], solve-group = "docs" }

[tool.pixi.tasks]
test = { cmd = "pytest", description = "Run the test suite" }
lint = { cmd = "pre-commit run --all-files", description = "Run ruff/black/mypy via pre-commit" }
docs = { cmd = "mkdocs serve", description = "Serve the documentation locally" }
build-golden = { cmd = "bash scripts/build_golden_output.sh", description = "Build the golden dataset (needs ~/.netrc Earthdata login)" }
validate = { cmd = "bash scripts/run_validation.sh", description = "Validate this install against a golden dataset: pixi run validate --golden-dir DIR" }
